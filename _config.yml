# Site

title: Kiran Mathews
description: "Senior Research Engineer at Bosch Corporate Research, writing about networking protocols, Linux internals, fault injection and in-vehicle networks."
url: https://k-mathews.com
lang: en

author:
  name: Kiran Mathews
  full_name: Dr.-Ing. Kiran Mathews
  role: Senior Research Engineer
  org: Bosch Corporate Research
  location: Stuttgart area, Germany
  location_short: Stuttgart area, DE
  email: kiranmathews20@gmail.com
  github: warlock20
  linkedin: kiranmathews
  substack: https://warlock20.substack.com/   # write-ups about companies
  scholar:        # full Google Scholar profile URL; links are hidden while empty
  cv:             # path or URL of a CV PDF, e.g. /assets/docs/cv.pdf; hidden while empty

# One line under the home page intro
now: "fault injection for automated safety analysis · 10BASE-T1S · IEEE 1722 · eBPF performance"

# Impressum (§ 5 DDG). The Impressum section and its footer link appear only when address is filled in.
impressum:
  address:        # list of lines, e.g. ["Musterstraße 1", "70000 Stuttgart", "Germany"]


# Build

permalink: /:categories/:title/
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sitemap
  - jekyll-feed

kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  footnote_backlink: "↑"
  entity_output: as_char
  toc_levels: 2..3

defaults:
  - scope:
      path: ""
    values:
      layout: base
  - scope:
      path: ""
      type: posts
    values:
      layout: post

