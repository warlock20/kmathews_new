# Local preview: `docker compose up`, then open http://localhost:4000
services:
  site:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: bundle exec jekyll serve --host 0.0.0.0 --livereload --config _config.yml,_config.dev.yml --destination /tmp/_site
    environment:
      # In development, `jekyll serve` rewrites site.url to http://0.0.0.0:4000, which browsers cannot load
      JEKYLL_ENV: production
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/site
